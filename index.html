<!doctype html>
<html lang="en">
  <head>
    <!-- 声明文档字符集，避免中文出现乱码。 -->
    <meta charset="UTF-8" />
    <!-- 浏览器标签页显示的小图标。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 移动端视口配置，保证页面在不同设备上的缩放行为正常。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 页面标题，会显示在浏览器标签页上。 -->
    <title>vite-project</title>
  </head>
  <body>
    <!-- React 根节点：所有页面最终都会挂载到这个 div 内。 -->
    <div id="root"></div>
    <!-- 通过 ES Module 方式加载前端入口脚本。 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
